[workspace]
resolver = "2"
members = ["crates/fectp-core", "crates/fectp", "crates/bench"]
exclude = ["crates/footprint"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/younghyeonpark/fectp"
authors = ["Younghyeon Park <ypark.dev@gmail.com>"]

[workspace.dependencies]
x25519-dalek     = { version = "2", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false }
blake2           = { version = "0.10", default-features = false }
zeroize          = { version = "1", default-features = false }
subtle           = { version = "2", default-features = false }
rand_core        = { version = "0.6", default-features = false }

# This protocol's whole claim is speed, and its hot path crosses a crate
# boundary on every send: fectp calls into fectp-core to frame and seal. The
# default release profile will not inline across that boundary.
[profile.release]
lto = true
codegen-units = 1
