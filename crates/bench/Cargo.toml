[package]
name = "fectp-bench"
description = "Measured comparison of FECTP against other transports"
version.workspace = true
edition.workspace = true
# Not the workspace value: rcgen, used to make certificates for the
# TLS comparison, pulls in `time`, which needs 1.88. The published
# crates still build on 1.85; this harness is a development tool.
rust-version = "1.88"
license.workspace = true
publish = false
# Adding a second binary made `cargo run -p fectp-bench --release` ambiguous,
# and that is the command at the top of docs/BENCHMARKS.md. The benchmark is
# what this crate is for; `idle` is a diagnostic reached by name.
default-run = "bench"

[dependencies]
fectp = { path = "../fectp", features = ["compress"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = "0.13"
zstd = "0.13"
flate2 = "1"

[[bin]]
name = "bench"
path = "src/main.rs"
