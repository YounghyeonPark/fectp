[package]
name = "fectp"
description = "FECTP: fast encrypted transport, std API over UDP. Not security-audited."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["udp", "transport", "encryption", "noise", "embedded"]
categories = ["network-programming", "cryptography"]

# The `compress` feature is off by default, so docs.rs would document the
# crate without it and the compression API would simply be absent.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# The version is what a published crate depends on; the path is what this
# workspace builds against. Both are needed — crates.io refuses a dependency
# with no version requirement.
fectp-core = { path = "../fectp-core", version = "0.1.0", features = ["std"] }
rand_core = { workspace = true, features = ["std", "getrandom"] }
# So `Identity` can wipe its secret when it is dropped; a plain [u8; 32] has
# no destructor, and the secret outlived the value that owned it.
zeroize = { workspace = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
# Tests that build frames a cooperating peer never sends need the session
# layer directly: the identifier is chosen by the initiator, and choosing it
# is the precondition for the collision this guards against.
fectp-core = { path = "../fectp-core" }
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
default = []
compress = ["dep:zstd"]
