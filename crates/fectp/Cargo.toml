[package]
name = "fectp"
description = "FECTP: fast encrypted transport, std API over UDP. Not security-audited."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["udp", "transport", "encryption", "noise", "embedded"]
categories = ["network-programming", "cryptography"]

# The `compress` feature is off by default, so docs.rs would document the
# crate without it and the compression API would simply be absent.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# The version is what a published crate depends on; the path is what this
# workspace builds against. Both are needed — crates.io refuses a dependency
# with no version requirement.
fectp-core = { path = "../fectp-core", version = "0.3.2", features = ["std"] }
rand_core = { workspace = true, features = ["std", "getrandom"] }
# So `Identity` can wipe its secret when it is dropped; a plain [u8; 32] has
# no destructor, and the secret outlived the value that owned it.
zeroize = { workspace = true }
zstd = { version = "0.13", optional = true }

# Setting the don't-fragment bit, so path MTU discovery measures what a path
# carries whole (D89). `setsockopt` is `unsafe`, which this crate forbids, so
# each platform's option comes from a crate that wraps it safely: rustix has
# Linux's IP_PMTUDISC_PROBE and no Apple option, nix has Apple's IP_DONTFRAG
# and no Linux IPv4 one. Windows has no safe route, and goes without.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
# `time` only because rustix's `net` does not build without it: its socket
# timeout options refer to a module that `time` switches on.
rustix = { version = "1", default-features = false, features = ["std", "net", "time"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
nix = { version = "0.29", default-features = false, features = ["socket", "net"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
# Tests that build frames a cooperating peer never sends need the session
# layer directly: the identifier is chosen by the initiator, and choosing it
# is the precondition for the collision this guards against.
fectp-core = { path = "../fectp-core" }
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
default = []
compress = ["dep:zstd"]
