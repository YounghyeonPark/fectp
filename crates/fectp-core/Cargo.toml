[package]
name = "fectp-core"
description = "FECTP core: no_std Noise_IK_25519_ChaChaPoly_BLAKE2s session layer and wire format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["noise", "no-std", "udp", "protocol", "embedded"]
categories = ["network-programming", "cryptography", "no-std", "embedded"]

# `std` is off by default, and the error trait and Vec helpers it adds would
# not otherwise appear.
[package.metadata.docs.rs]
all-features = true

[dependencies]
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
blake2.workspace = true
zeroize.workspace = true
subtle.workspace = true
rand_core.workspace = true

[features]
default = []
# Enables std-only conveniences (error impl, Vec-based helpers).
std = ["chacha20poly1305/std", "rand_core/std"]

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
snow = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
