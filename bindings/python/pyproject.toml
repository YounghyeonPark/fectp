[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fectp"
dynamic = ["version"]
description = "FECTP from Python: the sans-IO encrypted session layer, over its C ABI. Not security-audited."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["noise-protocol", "udp", "encryption", "transport", "x25519"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
]

[project.urls]
Repository = "https://github.com/YounghyeonPark/fectp"
Documentation = "https://github.com/YounghyeonPark/fectp/blob/main/bindings/python/README.md"

[tool.setuptools]
packages = ["fectp", "fectp._native"]

[tool.setuptools.package-data]
# The shared library, staged here before the wheel is built. Not in the
# repository: it is built by cargo for each platform.
"fectp._native" = ["*fectp.*"]
